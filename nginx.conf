# 운영용 Nginx 설정 (Dockerfile 이 이미지에 넣는다)
# - 프론트 빌드 결과(dist)를 내주고, /api · /images · /ws-stomp 만 백엔드로 넘긴다
#   (개발 때 vite.config.ts 프록시가 하던 일). 브라우저 입장에서는 한 주소라 CORS 문제가 없다
# - 백엔드 주소는 배포용 compose(Backend/Web/compose.prod.yaml)의 서비스 이름 app:8080

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 이미지 업로드 한도 (백엔드: 요청 전체 100MB)
    client_max_body_size 100m;

    location /api/ {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    location /images/ {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        expires 7d;
    }

    # 실시간 채팅 (STOMP over WebSocket). Upgrade 헤더를 넘겨야 연결된다
    location /ws-stomp {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_read_timeout 1h;
    }

    # 빌드 파일 이름에 해시가 붙어 있어 오래 캐시해도 된다
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # React Router(BrowserRouter): 없는 경로는 index.html 로 돌려 화면에서 처리한다
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
